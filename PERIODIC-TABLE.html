<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Periodic Table</title>

  <style>
    /* ── Page background ── */
    body {
      background-color: #1a1a2e;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
      color: #00d2ff;
    }

    p {
      color: #aaa;
      margin-bottom: 20px;
    }

    /* ── The grid that holds all element boxes ── */
    .table {
      display: grid;
      grid-template-columns: repeat(18, 55px); /* 18 columns */
      gap: 3px;
      justify-content: center;
    }

    /* ── Each element box ── */
    .element {
      width: 55px;
      height: 60px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;

      /* Smooth zoom on hover */
      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* ── Hover effect ── */
    .element:hover {
      transform: scale(1.4);
      z-index: 10;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    /* ── Text inside each box ── */
    .num  { font-size: 10px; opacity: 0.7; }
    .sym  { font-size: 18px; font-weight: bold; }
    .name { font-size: 7px; opacity: 0.8; }

    /* ── Empty cell (blank space in the grid) ── */
    .empty { width: 55px; height: 60px; }

    /* ── Colours for each element type ── */
    .alkali     { background-color: #e74c3c; } /* Red */
    .alkaline   { background-color: #e67e22; } /* Orange */
    .transition { background-color: #2980b9; } /* Blue */
    .post       { background-color: #8e44ad; } /* Purple */
    .metalloid  { background-color: #27ae60; } /* Green */
    .nonmetal   { background-color: #f39c12; } /* Yellow */
    .halogen    { background-color: #c0392b; } /* Dark Red */
    .noble      { background-color: #16a085; } /* Teal */
    .lanthanide { background-color: #d35400; } /* Burnt Orange */
    .actinide   { background-color: #7f8c8d; } /* Grey */

    /* ── Legend at the bottom ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <h1>⚗️ Periodic Table of Elements</h1>
  <p>Hover over any element to see its details</p>

  <!-- The grid is built here by JavaScript -->
  <div class="table" id="table"></div>

  <!-- Colour legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-box alkali"></div>     Alkali Metal</div>
    <div class="legend-item"><div class="legend-box alkaline"></div>   Alkaline Earth</div>
    <div class="legend-item"><div class="legend-box transition"></div> Transition Metal</div>
    <div class="legend-item"><div class="legend-box post"></div>       Post-Transition</div>
    <div class="legend-item"><div class="legend-box metalloid"></div>  Metalloid</div>
    <div class="legend-item"><div class="legend-box nonmetal"></div>   Nonmetal</div>
    <div class="legend-item"><div class="legend-box halogen"></div>    Halogen</div>
    <div class="legend-item"><div class="legend-box noble"></div>      Noble Gas</div>
    <div class="legend-item"><div class="legend-box lanthanide"></div> Lanthanide</div>
    <div class="legend-item"><div class="legend-box actinide"></div>   Actinide</div>
  </div>

  <script>

      { num:12, sym:'Mg', name:'Magnesium',     mass:'24.31',  type:'alkaline',   row:3, col:2  },

      { num:14, sym:'Si', name:'Silicon',       mass:'28.09',  type:'metalloid',  row:3, col:14 },
      { num:15, sym:'P',  name:'Phosphorus',    mass:'30.97',  type:'nonmetal',   row:3, col:15 },
      { num:16, sym:'S',  name:'Sulfur',        mass:'32.06',  type:'nonmetal',   row:3, col:16 },
      { num:17, sym:'Cl', name:'Chlorine',      mass:'35.45',  type:'halogen',    row:3, col:17 },
      { num:18, sym:'Ar', name:'Argon',         mass:'39.95',  type:'noble',      row:3, col:18 },

      // Period 4
      { num:19, sym:'K',  name:'Potassium',     mass:'39.10',  type:'alkali',     row:4, col:1  },
      { num:20, sym:'Ca', name:'Calcium',       mass:'40.08',  type:'alkaline',   row:4, col:2  },
      { num:21, sym:'Sc', name:'Scandium',      mass:'44.96',  type:'transition', row:4, col:3  },
      { num:22, sym:'Ti', name:'Titanium',      mass:'47.87',  type:'transition', row:4, col:4  },
      { num:23, sym:'V',  name:'Vanadium',      mass:'50.94',  type:'transition', row:4, col:5  },
      { num:24, sym:'Cr', name:'Chromium',      mass:'52.00',  type:'transition', row:4, col:6  },
      { num:25, sym:'Mn', name:'Manganese',     mass:'54.94',  type:'transition', row:4, col:7  },

      { num:30, sym:'Zn', name:'Zinc',          mass:'65.38',  type:'transition', row:4, col:12 },

      // Period 5
      { num:37, sym:'Rb', name:'Rubidium',      mass:'85.47',  type:'alkali',     row:5, col:1  },
      { num:38, sym:'Sr', name:'Strontium',     mass:'87.62',  type:'alkaline',   row:5, col:2  },
      { num:39, sym:'Y',  name:'Yttrium',       mass:'88.91',  type:'transition', row:5, col:3  },
      { num:40, sym:'Zr', name:'Zirconium',     mass:'91.22',  type:'transition', row:5, col:4  },
      { num:41, sym:'Nb', name:'Niobium',       mass:'92.91',  type:'transition', row:5, col:5  },
      { num:42, sym:'Mo', name:'Molybdenum',    mass:'95.96',  type:'transition', row:5, col:6  },
      { num:43, sym:'Tc', name:'Technetium',    mass:'[98]',   type:'transition', row:5, col:7  },
      { num:44, sym:'Ru', name:'Ruthenium',     mass:'101.1',  type:'transition', row:5, col:8  },
      { num:45, sym:'Rh', name:'Rhodium',       mass:'102.9',  type:'transition', row:5, col:9  },
      { num:46, sym:'Pd', name:'Palladium',     mass:'106.4',  type:'transition', row:5, col:10 },
      { num:47, sym:'Ag', name:'Silver',        mass:'107.9',  type:'transition', row:5, col:11 },
      { num:48, sym:'Cd', name:'Cadmium',       mass:'112.4',  type:'transition', row:5, col:12 },
      { num:49, sym:'In', name:'Indium',        mass:'114.8',  type:'post',       row:5, col:13 },
      { num:50, sym:'Sn', name:'Tin',           mass:'118.7',  type:'post',       row:5, col:14 },
      { num:51, sym:'Sb', name:'Antimony',      mass:'121.8',  type:'metalloid',  row:5, col:15 },
      { num:52, sym:'Te', name:'Tellurium',     mass:'127.6',  type:'metalloid',  row:5, col:16 },
      { num:53, sym:'I',  name:'Iodine',        mass:'126.9',  type:'halogen',    row:5, col:17 },
      { num:54, sym:'Xe', name:'Xenon',         mass:'131.3',  type:'noble',      row:5, col:18 },

      // Period 6 (main table — lanthanides shown below)
      { num:55, sym:'Cs', name:'Caesium',       mass:'132.9',  type:'alkali',     row:6, col:1  },
      { num:56, sym:'Ba', name:'Barium',        mass:'137.3',  type:'alkaline',   row:6, col:2  },
      { num:72, sym:'Hf', name:'Hafnium',       mass:'178.5',  type:'transition', row:6, col:4  },

      { num:74, sym:'W',  name:'Tungsten',      mass:'183.8',  type:'transition', row:6, col:6  },
      { num:75, sym:'Re', name:'Rhenium',       mass:'186.2',  type:'transition', row:6, col:7  },
      { num:76, sym:'Os', name:'Osmium',        mass:'190.2',  type:'transition', row:6, col:8  },
      { num:77, sym:'Ir', name:'Iridium',       mass:'192.2',  type:'transition', row:6, col:9  },
      { num:78, sym:'Pt', name:'Platinum',      mass:'195.1',  type:'transition', row:6, col:10 },
      { num:79, sym:'Au', name:'Gold',          mass:'197.0',  type:'transition', row:6, col:11 },
      { num:80, sym:'Hg', name:'Mercury',       mass:'200.6',  type:'transition', row:6, col:12 },
      { num:81, sym:'Tl', name:'Thallium',      mass:'204.4',  type:'post',       row:6, col:13 },
      { num:82, sym:'Pb', name:'Lead',          mass:'207.2',  type:'post',       row:6, col:14 },
      { num:83, sym:'Bi', name:'Bismuth',       mass:'209.0',  type:'post',       row:6, col:15 },
      { num:84, sym:'Po', name:'Polonium',      mass:'[209]',  type:'post',       row:6, col:16 },
      { num:85, sym:'At', name:'Astatine',      mass:'[210]',  type:'halogen',    row:6, col:17 },
      { num:86, sym:'Rn', name:'Radon',         mass:'[222]',  type:'noble',      row:6, col:18 },

      // Period 7 (main table — actinides shown below)
      { num:87,  sym:'Fr', name:'Francium',     mass:'[223]',  type:'alkali',     row:7, col:1  },
      { num:88,  sym:'Ra', name:'Radium',       mass:'[226]',  type:'alkaline',   row:7, col:2  },
      { num:104, sym:'Rf', name:'Rutherfordium',mass:'[267]',  type:'transition', row:7, col:4  },
      { num:105, sym:'Db', name:'Dubnium',      mass:'[268]',  type:'transition', row:7, col:5  },
      { num:106, sym:'Sg', name:'Seaborgium',   mass:'[271]',  type:'transition', row:7, col:6  },
      { num:107, sym:'Bh', name:'Bohrium',      mass:'[274]',  type:'transition', row:7, col:7  },
      { num:108, sym:'Hs', name:'Hassium',      mass:'[277]',  type:'transition', row:7, col:8  },
      { num:109, sym:'Mt', name:'Meitnerium',   mass:'[278]',  type:'transition', row:7, col:9  },
      { num:110, sym:'Ds', name:'Darmstadtium', mass:'[281]',  type:'transition', row:7, col:10 },

      { num:114, sym:'Fl', name:'Flerovium',    mass:'[289]',  type:'post',       row:7, col:14 },
      { num:115, sym:'Mc', name:'Moscovium',    mass:'[290]',  type:'post',       row:7, col:15 },
      { num:116, sym:'Lv', name:'Livermorium',  mass:'[293]',  type:'post',       row:7, col:16 },

    ];

    // Lanthanides (row 9 = separate row below)
    const lanthanides = [
      { num:57, sym:'La', name:'Lanthanum',     mass:'138.9',  type:'lanthanide' },
      { num:58, sym:'Ce', name:'Cerium',        mass:'140.1',  type:'lanthanide' },
      { num:59, sym:'Pr', name:'Praseodymium',  mass:'140.9',  type:'lanthanide' },
      { num:60, sym:'Nd', name:'Neodymium',     mass:'144.2',  type:'lanthanide' },
      { num:61, sym:'Pm', name:'Promethium',    mass:'[145]',  type:'lanthanide' },
      { num:62, sym:'Sm', name:'Samarium',      mass:'150.4',  type:'lanthanide' },
      { num:63, sym:'Eu', name:'Europium',      mass:'152.0',  type:'lanthanide' },
      { num:64, sym:'Gd', name:'Gadolinium',    mass:'157.3',  type:'lanthanide' },
      { num:65, sym:'Tb', name:'Terbium',       mass:'158.9',  type:'lanthanide' },
      { num:66, sym:'Dy', name:'Dysprosium',    mass:'162.5',  type:'lanthanide' },
      { num:67, sym:'Ho', name:'Holmium',       mass:'164.9',  type:'lanthanide' },
      { num:68, sym:'Er', name:'Erbium',        mass:'167.3',  type:'lanthanide' },
      { num:69, sym:'Tm', name:'Thulium',       mass:'168.9',  type:'lanthanide' },
      { num:70, sym:'Yb', name:'Ytterbium',     mass:'173.0',  type:'lanthanide' },
      { num:71, sym:'Lu', name:'Lutetium',      mass:'175.0',  type:'lanthanide' },
    ];

    // Actinides (row 10 = separate row below)
    const actinides = [
      { num:89,  sym:'Ac', name:'Actinium',      mass:'[227]',  type:'actinide' },
      { num:90,  sym:'Th', name:'Thorium',        mass:'232.0',  type:'actinide' },
      { num:91,  sym:'Pa', name:'Protactinium',   mass:'231.0',  type:'actinide' },
      { num:92,  sym:'U',  name:'Uranium',        mass:'238.0',  type:'actinide' },
      { num:93,  sym:'Np', name:'Neptunium',      mass:'[237]',  type:'actinide' },
      { num:94,  sym:'Pu', name:'Plutonium',      mass:'[244]',  type:'actinide' },
      { num:95,  sym:'Am', name:'Americium',      mass:'[243]',  type:'actinide' },
      { num:96,  sym:'Cm', name:'Curium',         mass:'[247]',  type:'actinide' },
      { num:97,  sym:'Bk', name:'Berkelium',      mass:'[247]',  type:'actinide' },
      { num:98,  sym:'Cf', name:'Californium',    mass:'[251]',  type:'actinide' },
      { num:99,  sym:'Es', name:'Einsteinium',    mass:'[252]',  type:'actinide' },
      { num:100, sym:'Fm', name:'Fermium',        mass:'[257]',  type:'actinide' },
      { num:101, sym:'Md', name:'Mendelevium',    mass:'[258]',  type:'actinide' },
      { num:102, sym:'No', name:'Nobelium',       mass:'[259]',  type:'actinide' },
      { num:103, sym:'Lr', name:'Lawrencium',     mass:'[266]',  type:'actinide' },
    ];

    // ── STEP 1: Build a 7×18 grid (7 rows, 18 columns) ──
    // Create a 2D array filled with null
    const grid = [];
    for (let r = 0; r < 7; r++) {
      grid[r] = [];
      for (let c = 0; c < 18; c++) {
        grid[r][c] = null;  // empty cell
      }
    }

    // Place each element into the correct row and column
    // row and col in our data start at 1, but arrays start at 0
    for (const el of elements) {
      grid[el.row - 1][el.col - 1] = el;
    }

    // ── STEP 2: Create one HTML box for an element ──
    function makeBox(el) {
      const div = document.createElement('div');
      div.className = 'element ' + el.type;  // type sets the colour

      // Show atomic number, symbol, name, mass inside the box
      div.innerHTML = `
        <span class="num">${el.num}</span>
        <span class="sym">${el.sym}</span>
        <span class="name">${el.name}</span>
        <span class="num">${el.mass}</span>
      `;

      // Show a popup alert when clicked (simple & beginner-friendly)
      div.title = `${el.name} | Atomic No: ${el.num} | Mass: ${el.mass}`;

      return div;
    }

    // ── STEP 3: Draw the main table ──
    const tableDiv = document.getElementById('table');

    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 18; c++) {
        const el = grid[r][c];
        if (el) {
          tableDiv.appendChild(makeBox(el));  // add element box
        } else {
          // Add a blank space
          const empty = document.createElement('div');
          empty.className = 'empty';
          tableDiv.appendChild(empty);
        }
      }
    }

    // ── STEP 4: Add a gap + label row for f-block ──
    const gap = document.createElement('div');
    gap.style.cssText = 'grid-column: 1/19; height: 15px;';
    tableDiv.appendChild(gap);

    const label = document.createElement('div');
    label.style.cssText = 'grid-column: 1/19; text-align:center; font-size:12px; color:#aaa; margin-bottom:5px;';
    label.textContent = '── Lanthanides & Actinides ──';
    tableDiv.appendChild(label);

    // ── STEP 5: Draw Lanthanides row (offset by 3 empty cells) ──
    for (let i = 0; i < 3; i++) {
      const e = document.createElement('div'); e.className = 'empty';
      tableDiv.appendChild(e);
    }
    for (const el of lanthanides) {
      tableDiv.appendChild(makeBox(el));
    }

    // ── STEP 6: Draw Actinides row (offset by 3 empty cells) ──
    for (let i = 0; i < 3; i++) {
      const e = document.createElement('div'); e.className = 'empty';
      tableDiv.appendChild(e);
    }
    for (const el of actinides) {
      tableDiv.appendChild(makeBox(el));
    }
  </script>

</body>
</html>
